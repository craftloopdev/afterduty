name: Bug Report
description: Report a bug found during testing or review
title: "[Bug] "
labels: ["type-bugfix", "tier-autonomous", "project-qa"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What's broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to trigger the bug
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical — blocks usage"
        - "High — major feature broken"
        - "Medium — workaround exists"
        - "Low — cosmetic or minor"
      default: 2
    validations:
      required: true

  - type: input
    id: source-issue
    attributes:
      label: Source Issue
      description: "Issue # this bug was found in (if applicable)"
      placeholder: "#42"
    validations:
      required: false
