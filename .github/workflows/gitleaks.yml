name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

# VCP-HARD-01: least privilege. gitleaks-action enumerates the PR's commits and
# posts a comment if it finds a leak, so it needs pull-requests access in addition
# to reading the code. (contents: read alone → "Resource not accessible by integration".)
permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: detect secrets in diff + history
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening); the trailing
      # comment records the human-readable version for Dependabot to bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
