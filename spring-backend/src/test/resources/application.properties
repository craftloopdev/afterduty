# H2 in-memory database for @DataJpaTest slice tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable scheduling during tests
spring.task.scheduling.enabled=false

# Disable GCP Cloud SQL auto-configuration during tests.
# CloudSqlEnvironmentPostProcessor is registered as an EnvironmentPostProcessor via spring.factories;
# it checks spring.cloud.gcp.sql.enabled before attempting to build a Cloud SQL JDBC URL.
# Without this, the processor fires because org.postgresql.Driver and
# com.google.cloud.sql.postgres.SocketFactory are on the test classpath (runtimeOnly), finds no
# spring.cloud.gcp.sql.database-name, and throws "A database name must be provided."
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.sql.jdbc.enabled=false

# Allow Spring to resolve circular references between AnalysisScheduler and the state
# machines (SynthesisStateMachine, GapStateMachine inject AnalysisScheduler via
# constructor; AnalysisScheduler injects them back via @Autowired(required=false)
# setters). Spring Boot 2.6+ disables circular-ref resolution by default.
spring.main.allow-circular-references=true

# Disable H2 referential integrity checks so tests can persist Claim/EvidenceItem/Atom
# rows using arbitrary FK values (e.g., userId=1L) without pre-creating User rows.
# The FK constraint from claims.user_id → users.id would otherwise reject inserts.
spring.datasource.hikari.connection-init-sql=SET REFERENTIAL_INTEGRITY FALSE
